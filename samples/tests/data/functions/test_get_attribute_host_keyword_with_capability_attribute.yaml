tosca_definitions_version: tosca_simple_yaml_1_0

capability_types:
  custom.capabilities.Endpoint:
    derived_from: tosca.capabilities.Endpoint
    attributes:
      tls_certificates:
        type: map
        entry_schema:
          type: string

node_types:
  custom.nodes.Compute:
    derived_from: tosca.nodes.Compute
    capabilities:
      endpoint:
        type: custom.capabilities.Endpoint

topology_template:
  node_templates:
    application:
      type: tosca.nodes.SoftwareComponent
      interfaces:
        Standard:
          configure:
            inputs:
              tls_certs:
                get_attribute: [ HOST, endpoint, tls_certificates ]
      requirements:
        - host: server

    server:
      type: custom.nodes.Compute

